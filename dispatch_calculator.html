<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dispatch Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script>
// Password gate - runs before any other script. Blocks rendering until correct
// password is entered. SessionStorage remembers the unlock for this tab session.
(function(){
  var PASSWORD = "M2026";
  var SESSION_KEY = "dispatch_unlocked";
  if (sessionStorage.getItem(SESSION_KEY) === "yes") return;
  // Hide content until unlocked; gate overlay added on DOMContentLoaded.
  document.documentElement.style.visibility = "hidden";
  document.addEventListener("DOMContentLoaded", function(){
    if (sessionStorage.getItem(SESSION_KEY) === "yes") {
      document.documentElement.style.visibility = "visible";
      return;
    }
    var gate = document.createElement("div");
    gate.style.cssText = "position:fixed;inset:0;background:#0b1220;color:#e8eef7;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Sans',system-ui,sans-serif;visibility:visible";
    gate.innerHTML =
      "<div style='background:#162032;padding:36px 42px;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.4);max-width:380px;width:90%;text-align:center'>" +
        "<div style='font-size:22px;font-weight:600;margin-bottom:6px'>Dispatch Calculator</div>" +
        "<div style='font-size:13px;color:#8aa0bb;margin-bottom:22px'>Internal tool &middot; Milsped LLC</div>" +
        "<input id='pwd-input' type='password' placeholder='Password' autocomplete='off' style='width:100%;padding:12px 14px;border:1px solid #2a3a52;background:#0b1220;color:#e8eef7;border-radius:8px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box'>" +
        "<div id='pwd-err' style='color:#f87171;font-size:12px;height:16px;margin-top:8px;visibility:hidden'>Wrong password</div>" +
        "<button id='pwd-btn' style='width:100%;margin-top:14px;padding:12px;border:none;border-radius:8px;background:#1a8a60;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit'>Unlock</button>" +
      "</div>";
    document.body.appendChild(gate);
    document.documentElement.style.visibility = "visible";
    var inp = document.getElementById("pwd-input");
    var btn = document.getElementById("pwd-btn");
    var err = document.getElementById("pwd-err");
    function tryUnlock(){
      if (inp.value === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "yes");
        gate.remove();
      } else {
        err.style.visibility = "visible";
        inp.select();
      }
    }
    btn.addEventListener("click", tryUnlock);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
    setTimeout(function(){ inp.focus(); }, 50);
  });
})();
</script>
</head>
<body>

<!-- ── Loading overlay ─────────────────────────────────────────────── -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Loading…</div>
</div>

<div class="wrap">

  <!-- ── Header ────────────────────────────────────────────────────── -->
  <header style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <h1>Dispatch Calculator</h1>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="badge-g">CD drivers</div>
      <div class="badge" id="period-badge"></div>
      <a href="fuel_dashboard.html" class="btn-icon" target="_blank" style="text-decoration:none">⛽ Fuel Dashboard</a>
    </div>
  </header>

  <!-- ── Top control bar: period + dispatcher + print ───────────────── -->
  <div class="top-bar">
    <div class="top-bar-left">
      <div class="period-group">
        <span class="period-lbl">Period</span>
        <div class="period-toggle" id="period-toggle">
          <button data-period="30">30d</button>
          <button data-period="90" class="on">90d</button>
          <button data-period="180">180d</button>
          <button data-period="365">365d</button>
          <button data-period="all">All</button>
        </div>
        <span class="period-info" id="period-info"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="period-lbl">Dispatcher<span style="color:var(--rd)">*</span></span>
        <input type="text" id="dispatcher-name" placeholder="required for print" required style="padding:5px 9px;border:1px solid var(--bd2);border-radius:5px;font-size:12px;width:140px;outline:none">
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="period-lbl">Truck #<span style="color:var(--rd)">*</span></span>
        <input type="text" id="truck-number" placeholder="required for print" required style="padding:5px 9px;border:1px solid var(--bd2);border-radius:5px;font-size:12px;width:90px;outline:none">
      </div>
    </div>
    <div class="top-bar-right print-controls">
      <span class="trace-count" id="trace-count">Trace: <b>0</b></span>
      <button class="btn-icon" id="btn-export-log" title="Export trace as JSON">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg> Export
      </button>
      <button class="btn-icon" id="btn-clear-log" title="Clear trace log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <button class="btn-icon primary" id="btn-print" title="Save HTML report and open print dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg> Print
      </button>
    </div>
  </div>

  <!-- ── Fleet ref ──────────────────────────────────────────────────── -->
  <div class="fleet-ref">
    <div class="fleet-ref-title">Fleet averages — reference values (CD drivers, selected period)</div>
    <div class="fleet-row" id="fleet-row"></div>
  </div>

  <!-- ── Ranking ────────────────────────────────────────────────────── -->
  <div class="rank-header">
    <div class="rank-header-lbl">Load comparison</div>
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:11px;color:var(--mu)">Rank by:</span>
      <div class="rank-toggle">
        <button id="rb-cm_pt"            onclick="CalcUI.setMetric('cm_pt')">CM/load</button>
        <button id="rb-cm_day" class="on" onclick="CalcUI.setMetric('cm_day')">CM/day</button>
        <button id="rb-cm_pm"             onclick="CalcUI.setMetric('cm_pm')">CM/mi</button>
      </div>
    </div>
  </div>
  <div class="rank-strip" id="rank-strip"></div>

  <!-- ── Calc grid ──────────────────────────────────────────────────── -->
  <div class="calc-section-lbl">Load calculators</div>
  <div class="calc-grid" id="calc-grid">
    <button class="add-calc-btn" onclick="CalcUI.addCalc()" title="Add load">＋</button>
  </div>

  <!-- ── Map ────────────────────────────────────────────────────────── -->
  <div class="map-card">
    <div class="map-hdr">
      <div>
        <div class="map-hdr-l">Route visualization</div>
        <div class="map-hdr-sub">Color = selected metric · thickness = miles · hover for details</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu)">
        <div style="width:50px;height:3px;background:linear-gradient(90deg,#c8d8e8,#55c5b3,#1f9080);border-radius:2px"></div>
        low → high
      </div>
    </div>
    <svg id="calc-map" viewBox="0 0 960 520" style="height:260px"></svg>
  </div>

</div>

<!-- Skripte — ucitavaju se redom -->
<!-- Inline data bundle - omogucava otvaranje bez Pythona/HTTP servera.
     Ako bundle.js ne postoji, app.js ce fallback-ovati na fetch(). -->
<!-- Cache-bust: hourly version bumps force browser to re-download bundle.js each hour.
     Real deploys still rely on Pages CDN refresh (usually within 60s after push). -->
<script>
(function(){
  var d = new Date();
  var v = d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0') + String(d.getUTCHours()).padStart(2,'0');
  var s = document.createElement('script');
  s.src = 'data/bundle.js?v=' + v;
  s.onerror = function(){ console.log('bundle.js not found - using fetch fallback'); };
  document.currentScript.parentNode.insertBefore(s, document.currentScript);
})();
</script>

<script src="js/zip-distance.js"></script>
<script src="js/calc-core.js"></script>
<script src="js/fuel-recommender.js"></script>
<script src="js/lane-recommender.js"></script>
<script src="js/print-trace.js"></script>
<script src="js/calc-ui.js"></script>
<script src="js/calc-ui-card.js"></script>
<script src="js/app.js"></script>

</body>
</html>
